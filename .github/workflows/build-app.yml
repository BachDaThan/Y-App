name: Build Yui App

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.${{ github.run_number }}
  ICON_PATH: ""

jobs:
  sync-yui:
    # yui.cpp (native/yui.cpp) phải giống hệt bản ở Adaptive-MoE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kiểm tra đồng bộ yui.cpp
        run: python tools/check_yui_sync.py --strict

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Biên dịch libyui.so (NDK, arm64-v8a)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          echo "NDK=$NDK"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          "$CXX" -O3 -DYUI_LIB -shared -fPIC -std=c++17 -fopenmp-simd -static-libstdc++ \
            -Wl,-z,max-page-size=16384 native/yui.cpp -o libyui.so
          ls -la libyui.so

      - name: Sinh thư mục android/ và gắn libyui.so
        run: |
          flutter create --platforms=android --org com.bachdathan --project-name yui_app .
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application#' "$MANIFEST"
          if grep -q "<queries>" "$MANIFEST"; then
            sed -i 's#<queries>#<queries>\n        <intent><action android:name="android.speech.RecognitionService"/></intent>\n        <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>#' "$MANIFEST"
          else
            sed -i 's#<application#<queries>\n        <intent><action android:name="android.speech.RecognitionService"/></intent>\n        <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>\n    </queries>\n    <application#' "$MANIFEST"
          fi
          sed -i 's#android:label="[^"]*"#android:label="Yui"#' "$MANIFEST"
          for G in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$G" ] && sed -i -E 's/minSdk(Version)? ?=? ?flutter\.minSdkVersion/minSdk = 24/' "$G"
          done
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp libyui.so android/app/src/main/jniLibs/arm64-v8a/
          grep -n "INTERNET\|RECORD_AUDIO\|RecognitionService\|TTS_SERVICE\|android:label" "$MANIFEST"

      - name: Tắt lintVital (fix crash CommentDetector)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]:
              if not p.exists():
                  continue
              text = p.read_text(encoding="utf-8")

              if "checkReleaseBuilds" in text:
                  text = re.sub(r'checkReleaseBuilds\s*=\s*\w+', 'checkReleaseBuilds = false', text)
                  text = re.sub(r'checkReleaseBuilds\s+\w+', 'checkReleaseBuilds false', text)
              else:
                  if p.suffix == ".kts":
                      block = "\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n"
                  else:
                      block = "\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n"
                  if "android {" in text:
                      text = text.replace("android {", "android {" + block, 1)
                  else:
                      text += "\nandroid {" + block + "}\n"

              p.write_text(text, encoding="utf-8")
              print(f"Patched lint: {p}")
          PY

      - name: Bật core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              p = Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("Không tìm thấy android/app/build.gradle(.kts)")

          text = p.read_text(encoding="utf-8")
          is_kts = p.suffix == ".kts"

          if "coreLibraryDesugaringEnabled" not in text and "isCoreLibraryDesugaringEnabled" not in text:
              if is_kts:
                  text = text.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
              else:
                  text = text.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")

          if "desugar_jdk_libs" not in text:
              dep = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if is_kts else '    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"'
              if "dependencies {" in text:
                  text = text.replace("dependencies {", "dependencies {\n" + dep, 1)
              else:
                  text += "\n\ndependencies {\n" + dep + "\n}\n"

          p.write_text(text, encoding="utf-8")
          print(f"Đã patch: {p}")
          PY

      - run: flutter pub get

      - name: Tìm file icon
        shell: bash
        run: |
          if [ -n "$ICON_PATH" ]; then
            f="$ICON_PATH"
          else
            echo "PNG trong assets/:"; find assets -type f -iname '*.png' | sort
            f="$(find assets -type f -iname '*icon*.png' | sort | head -1)"
            [ -z "$f" ] && f="$(find assets -type f -iname '*logo*.png' | sort | head -1)"
          fi
          test -n "$f" && test -f "$f" || { echo "::error::Không tìm thấy file icon PNG trong assets/ (hoặc ICON_PATH sai)"; exit 1; }
          echo "Dùng icon: $f"
          echo "ICON_FILE=$f" >> "$GITHUB_ENV"

      - name: Tạo icon launcher Android
        run: |
          flutter pub add --dev flutter_launcher_icons
          cat > icon_config.yaml <<EOF
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "$ICON_FILE"
            min_sdk_android: 21
          EOF
          dart run flutter_launcher_icons -f icon_config.yaml

      - name: Ép compileSdk 36
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/compile-sdk.gradle" <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.hasProperty('android')) {
                p.android.compileSdk = 36
              }
            }
          }
          EOF

      - name: Build APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name=${{ env.APP_VERSION }} \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION=${{ env.APP_VERSION }}

      - name: Ký APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -n "$KS_B64" ]; then
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/yui.jks"
            "$BT/zipalign" -P 16 -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/yui.jks" --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
              --ks-key-alias "$KEY_ALIAS" --out Yui-android-arm64.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs Yui-android-arm64.apk | head -3
          else
            echo "::warning::Chưa có secret ANDROID_KEYSTORE_BASE64"
            cp "$APK" Yui-android-arm64.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Yui-android
          path: Yui-android-arm64.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Biên dịch yui.dll
        shell: cmd
        run: cl /nologo /O2 /std:c++17 /EHsc /MT /LD /fp:fast /arch:AVX2 /DYUI_LIB native\yui.cpp /Fe:yui.dll

      - name: Sinh thư mục windows/
        shell: bash
        run: flutter create --platforms=windows --org com.bachdathan --project-name yui_app .

      - run: flutter pub get

      - name: Tìm file icon
        shell: bash
        run: |
          if [ -n "$ICON_PATH" ]; then
            f="$ICON_PATH"
          else
            echo "PNG trong assets/:"; find assets -type f -iname '*.png' | sort
            f="$(find assets -type f -iname '*icon*.png' | sort | head -1)"
            [ -z "$f" ] && f="$(find assets -type f -iname '*logo*.png' | sort | head -1)"
          fi
          test -n "$f" && test -f "$f" || { echo "::error::Không tìm thấy file icon PNG trong assets/ (hoặc ICON_PATH sai)"; exit 1; }
          echo "Dùng icon: $f"
          echo "ICON_FILE=$f" >> "$GITHUB_ENV"

      - name: Tạo icon Windows
        shell: bash
        run: |
          flutter pub add --dev flutter_launcher_icons
          cat > icon_config.yaml <<EOF
          flutter_launcher_icons:
            android: false
            ios: false
            image_path: "$ICON_FILE"
            windows:
              generate: true
              image_path: "$ICON_FILE"
              icon_size: 256
          EOF
          dart run flutter_launcher_icons -f icon_config.yaml

      - name: Build Windows
        run: flutter build windows --release --dart-define=APP_VERSION=${{ env.APP_VERSION }}

      - name: Đóng gói
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          Copy-Item yui.dll "$rel\"
          Compress-Archive -Path "$rel\*" -DestinationPath Yui-windows-portable.zip
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ env.APP_VERSION }} installer\yui.iss
          Move-Item dist\Yui-Setup.exe Yui-windows-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Yui-windows
          path: |
            Yui-windows-setup.exe
            Yui-windows-portable.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Gắn lại tag latest
        run: |
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Yui ${{ env.APP_VERSION }}
          make_latest: true
          body: |
            Yui ${{ env.APP_VERSION }}
            - Android: tải Yui-android-arm64.apk rồi mở để cài.
            - Windows: chạy Yui-windows-setup.exe hoặc giải nén Yui-windows-portable.zip.
          files: |
            dist/**/*.apk
            dist/**/*.exe
            dist/**/*.zip
