name: Build Yui App

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Biên dịch libyui.so (NDK, arm64-v8a)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          echo "NDK=$NDK"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          "$CXX" -O3 -DYUI_LIB -shared -fPIC -std=c++17 -fopenmp-simd -static-libstdc++ \
            -Wl,-z,max-page-size=16384 native/yui.cpp -o libyui.so
          ls -la libyui.so

      # Giống app Kính: thư mục android/ không nằm trong repo, workflow tự sinh bằng flutter create để khỏi lệch phiên bản Gradle/AGP/Kotlin
      - name: Sinh thư mục android/ và gắn libyui.so
        run: |
          flutter create --platforms=android --org com.bachdathan --project-name yui_app .
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          sed -i 's#android:label="[^"]*"#android:label="Yui"#' "$MANIFEST"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp libyui.so android/app/src/main/jniLibs/arm64-v8a/
          grep -n "INTERNET\|android:label" "$MANIFEST"

      - run: flutter pub get

      - name: Build APK
        run: >
          flutter build apk --release --target-platform android-arm64
          --build-name=${{ env.APP_VERSION }} --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=${{ env.APP_VERSION }}

      # Muốn cài ĐÈ được thì mọi bản phải ký bằng CÙNG một khoá. Khoá nằm trong GitHub Secrets (xem README.md).
      - name: Ký APK bằng khoá riêng
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ -n "$KS_B64" ]; then
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/yui.jks"
            "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/yui.jks" --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
              --ks-key-alias "$KEY_ALIAS" --out Yui-android-arm64.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs Yui-android-arm64.apk | head -3
          else
            echo "::warning::Chưa có secret ANDROID_KEYSTORE_BASE64: APK đang ký bằng khoá debug ngẫu nhiên, KHÔNG cài đè được giữa các lần build."
            cp "$APK" Yui-android-arm64.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Yui-android
          path: Yui-android-arm64.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Biên dịch yui.dll (MSVC, CRT tĩnh nên không cần cài thêm gì)
        shell: cmd
        run: cl /nologo /O2 /std:c++17 /EHsc /MT /LD /fp:fast /arch:AVX2 /DYUI_LIB native\yui.cpp /Fe:yui.dll

      - name: Sinh thư mục windows/
        shell: bash
        run: flutter create --platforms=windows --org com.bachdathan --project-name yui_app .

      - run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --dart-define=APP_VERSION=${{ env.APP_VERSION }}

      - name: Đóng gói (zip + trình cài đặt Inno Setup)
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          Copy-Item yui.dll "$rel\"
          Compress-Archive -Path "$rel\*" -DestinationPath Yui-windows-portable.zip
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ env.APP_VERSION }} installer\yui.iss
          Move-Item dist\Yui-Setup.exe Yui-windows-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Yui-windows
          path: |
            Yui-windows-setup.exe
            Yui-windows-portable.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Gắn lại tag latest vào commit này
        run: |
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Yui ${{ env.APP_VERSION }}
          make_latest: true
          body: |
            Yui ${{ env.APP_VERSION }}
            - Android: tải Yui-android-arm64.apk rồi mở để cài (cài đè lên bản cũ được nếu cùng khoá ký).
            - Windows: chạy Yui-windows-setup.exe (cài đè bản cũ), hoặc giải nén Yui-windows-portable.zip.
            Model (.yui) và lịch sử chat được giữ nguyên khi cập nhật.
          files: |
            dist/**/*.apk
            dist/**/*.exe
            dist/**/*.zip
