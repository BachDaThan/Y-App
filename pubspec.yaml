name: yui_app
description: Yui - chat AI offline chạy bằng engine C++ riêng (Adaptive-MoE), quản lý nhiều model .yui
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  # Cập nhật ngầm, chạy nền có nút Dừng, thông báo (ghim phiên bản đã biết API; nâng cấp cần xem lại services/background_guard.dart)
  flutter_foreground_task: 8.17.0
  flutter_local_notifications: 18.0.1
  open_filex: ^4.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/legal/
    - assets/brand/yui_icon_1024.png
    - assets/brand/logo_horizontal_dark.png
    - assets/brand/logo_horizontal_light.png
